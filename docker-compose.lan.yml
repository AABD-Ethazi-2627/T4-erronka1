# Added to the base configuration by security.py when config/lan.json exists.
# Different host IPs merge with the original localhost port mappings.
services:
  kibana:
    ports:
      - "${CNC_LAN_IP:?Configure config/lan.json}:5601:5601"
  elasticsearch:
    ports:
      - "${CNC_LAN_IP:?Configure config/lan.json}:9200:9200"
  scoring-api:
    ports:
      - "${CNC_LAN_IP:?Configure config/lan.json}:8000:8000"
  nifi:
    ports:
      - "${CNC_LAN_IP:?Configure config/lan.json}:8443:8443"
    environment:
      NIFI_WEB_PROXY_HOST: "${CNC_LAN_IP}:8443,localhost:8443,127.0.0.1:8443"
    volumes:
      - ${CNC_RUNTIME_DIR:?Use scripts/security.py}/nifi/keystore.p12:/opt/nifi/nifi-current/conf/keystore.p12:ro
