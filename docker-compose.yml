# docker-compose.yml — CNC Guard / Windows + Docker Desktop
# Filebeat-ek CSVak SMB bolumenetik irakurtzen ditu.
# Abiatzeko: .venv/Scripts/python.exe scripts/security.py up (SOPS + age)

services:
  # Kafka — Mezularitza bufferra (KRaft, ZooKeeper gabe)
  kafka:
    image: apache/kafka:3.9.1
    container_name: cnc-kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Mensajes, offsets y metadatos KRaft dentro del volumen persistente.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_METADATA_LOG_DIR: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [cnc-net]

  # Filebeat — CSV fitxategien irakurlea
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.17.4
    container_name: cnc-filebeat
    user: root
    restart: unless-stopped
    command: ["--strict.perms=false", "-e"]
    depends_on:
      - kafka
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # CIFS bolumena: kredentzialak SOPS wrapperrak ematen ditu.
      - cnc-csv-share:/datos-csv:ro
      - filebeat-data:/usr/share/filebeat/data
    networks: [cnc-net]

  # Apache NiFi — Transformazioa eta bideratzea
  nifi:
    image: apache/nifi:2.3.0
    container_name: cnc-nifi
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"
    environment:
      NIFI_WEB_HTTPS_PORT: "8443"
      SINGLE_USER_CREDENTIALS_USERNAME: "${NIFI_USERNAME:-cncadmin}"
      SINGLE_USER_CREDENTIALS_PASSWORD: "${NIFI_PASSWORD:?Use scripts/security.py (NiFi password must have at least 12 characters)}"
    volumes:
      - nifi-conf:/opt/nifi/nifi-current/conf
      - nifi-state:/opt/nifi/nifi-current/state
      - nifi-db:/opt/nifi/nifi-current/database_repository
      - nifi-flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi-content:/opt/nifi/nifi-current/content_repository
      - nifi-provenance:/opt/nifi/nifi-current/provenance_repository
      - nifi-errors:/opt/nifi/errors
      - ${CNC_RUNTIME_DIR:?Use scripts/security.py}/ca.crt:/opt/nifi/security/ca.crt:ro
    networks: [cnc-net]

  # Elasticsearch — Biltegiratze eta bilaketa
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    container_name: cnc-elasticsearch
    restart: unless-stopped
    entrypoint: ["/bin/tini", "--", "/bin/bash", "/usr/local/bin/cnc-elasticsearch-entrypoint.sh"]
    tmpfs:
      - /run/cnc-secrets:uid=1000,gid=0,mode=0700
    environment:
      discovery.type: "single-node"
      xpack.security.enabled: "true"
      xpack.security.autoconfiguration.enabled: "false"
      xpack.security.http.ssl.enabled: "true"
      xpack.security.http.ssl.key: /usr/share/elasticsearch/config/tls/server.key
      xpack.security.http.ssl.certificate: /usr/share/elasticsearch/config/tls/server.crt
      xpack.security.http.ssl.certificate_authorities: /usr/share/elasticsearch/config/tls/ca.crt
      xpack.security.transport.ssl.enabled: "true"
      xpack.security.transport.ssl.key: /usr/share/elasticsearch/config/tls/server.key
      xpack.security.transport.ssl.certificate: /usr/share/elasticsearch/config/tls/server.crt
      xpack.security.transport.ssl.certificate_authorities: /usr/share/elasticsearch/config/tls/ca.crt
      xpack.security.transport.ssl.verification_mode: certificate
      ELASTIC_PASSWORD_FILE: /run/secrets/elastic_password
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - ./scripts/elasticsearch-entrypoint.sh:/usr/local/bin/cnc-elasticsearch-entrypoint.sh:ro
      - ${CNC_RUNTIME_DIR:?Use scripts/security.py}/elasticsearch:/usr/share/elasticsearch/config/tls:ro
    secrets: [elastic_password]
    healthcheck:
      test: ["CMD-SHELL", "test $$(curl -s --cacert config/tls/ca.crt -o /dev/null -w '%{http_code}' https://localhost:9200) = 401"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [cnc-net]

  # Kibana — Bistaratzea
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.4
    container_name: cnc-kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ${CNC_RUNTIME_DIR:?Use scripts/security.py}/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
      - ${CNC_RUNTIME_DIR:?Use scripts/security.py}/kibana:/usr/share/kibana/config/tls:ro
    ports:
      - "127.0.0.1:5601:5601"
    networks: [cnc-net]

  # Scoring API — ML inferentzia (3. fasea)
  scoring-api:
    build:
      context: ./scoring
    container_name: cnc-scoring
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/models:ro
      - ${CNC_RUNTIME_DIR:?Use scripts/security.py}/scoring:/run/tls:ro
    environment:
      MODEL_PATH: /models/cnc_failure_model.pkl
      SCORING_API_TOKEN_FILE: /run/secrets/scoring_api_token
    secrets: [scoring_api_token]
    command: ["uvicorn", "score_api:app", "--host", "0.0.0.0", "--port", "8000", "--ssl-keyfile", "/run/tls/server.key", "--ssl-certfile", "/run/tls/server.crt"]
    networks: [cnc-net]

  # MongoDB — NiFi erroreen biltegiratzea
  mongodb:
    image: mongo:7
    container_name: cnc-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_USERNAME:-mongoadmin}"
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_password
    secrets: [mongo_password]
    volumes:
      - mongo-data:/data/db
    networks: [cnc-net]

networks:
  cnc-net:
    driver: bridge

secrets:
  elastic_password:
    file: ${CNC_RUNTIME_DIR:?Use scripts/security.py}/elastic_password
  scoring_api_token:
    file: ${CNC_RUNTIME_DIR:?Use scripts/security.py}/scoring_api_token
  mongo_password:
    file: ${CNC_RUNTIME_DIR:?Use scripts/security.py}/mongo_password

volumes:
  kafka-data:
  mongo-data:
  filebeat-data:
  nifi-conf:
  nifi-errors:
  nifi-state:
  nifi-db:
  nifi-flowfile:
  nifi-content:
  nifi-provenance:
  es-data:
  cnc-csv-share:
    driver: local
    driver_opts:
      type: cifs
      device: "//192.168.75.150/cnc-stream"
      o: "addr=192.168.75.150,username=${SMB_USERNAME},password=${SMB_PASSWORD},vers=3.0,ro,actimeo=0,cache=none,nohandlecache"
