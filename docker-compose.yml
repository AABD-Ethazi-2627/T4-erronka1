# docker-compose.yml — CNC Guard / Ikasle VM
# CSVak VM-an muntatutako SMB/NFS karpetatik irakurtzen ditu Filebeat-ek.
# Abiatzeko: docker compose up -d --build

services:
  # Kafka — Mezularitza bufferra (KRaft, ZooKeeper gabe)
  kafka:
    image: apache/kafka:3.9.1
    container_name: cnc-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [cnc-net]

  # Filebeat — CSV fitxategien irakurlea
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.17.4
    container_name: cnc-filebeat
    user: root
    restart: unless-stopped
    command: ["--strict.perms=false", "-e"]
    depends_on:
      - kafka
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # .env-ko CSV_DIR-k VM-an muntatutako karpetara apuntatu behar du.
      - ${CSV_DIR:-./cnc-stream}:/datos-csv:ro
      - filebeat-data:/usr/share/filebeat/data
    networks: [cnc-net]

  # Apache NiFi — Transformazioa eta bideratzea
  nifi:
    image: apache/nifi:2.3.0
    container_name: cnc-nifi
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      NIFI_WEB_HTTPS_PORT: "8443"
      SINGLE_USER_CREDENTIALS_USERNAME: "${NIFI_USERNAME:-cncadmin}"
      SINGLE_USER_CREDENTIALS_PASSWORD: "${NIFI_PASSWORD:?Set NIFI_PASSWORD in .env (12 characters minimum)}"
    volumes:
      - nifi-conf:/opt/nifi/nifi-current/conf
      - nifi-state:/opt/nifi/nifi-current/state
      - nifi-db:/opt/nifi/nifi-current/database_repository
      - nifi-flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi-content:/opt/nifi/nifi-current/content_repository
      - nifi-provenance:/opt/nifi/nifi-current/provenance_repository
    networks: [cnc-net]

  # Elasticsearch — Biltegiratze eta bilaketa
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    container_name: cnc-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: "single-node"
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks: [cnc-net]

  # Kibana — Bistaratzea
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.4
    container_name: cnc-kibana
    restart: unless-stopped
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    ports:
      - "5601:5601"
    networks: [cnc-net]

  # Scoring API — ML inferentzia (3. fasea)
  scoring-api:
    build:
      context: ./scoring
    container_name: cnc-scoring
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models:ro
    environment:
      MODEL_PATH: /models/cnc_failure_model.pkl
    networks: [cnc-net]

networks:
  cnc-net:
    driver: bridge

volumes:
  kafka-data:
  filebeat-data:
  nifi-conf:
  nifi-state:
  nifi-db:
  nifi-flowfile:
  nifi-content:
  nifi-provenance:
  es-data:
