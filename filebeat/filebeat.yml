# ═══════════════════════════════════════════════════════════════════
# CNC Guard — Filebeat Konfigurazioa
# IKASLEEK OSATU BEHAR DUTE
# ═══════════════════════════════════════════════════════════════════



filebeat.inputs:
  - type: filestream
    id: cnc-stream
    paths:
      - /datos-csv/*.csv

    # Ignorar la cabecera del CSV
    exclude_lines: ['^timestamp,']

    # Identificar los archivos por su ruta
    file_identity:
      path: ~

output.kafka:
  hosts: ["kafka:9092"]
  topic: "cnc-sensors-raw"
  codec.format:
    string: '%{[message]}'

logging.level: info
logging.to_files: false

